# ─── Vexa Agent Control — Local Demonstration Profile ─────────────────────────
#
# WARNING: This profile is for LOCAL DEMO / EVALUATION ONLY.
# For production or any network-reachable deployment, use docker-compose.team.secure.yml
# which provisions Caddy reverse proxy with TLS certificate termination and VPC ingress auth.
#
# Services:
#   postgres           — Persistent relational database (isolated to internal bridge network)
#   control-plane-api  — Central Go REST API & Policy Hub (port 8081 loopback)
#   control-plane-ui   — React web console & reverse proxy (port 3000 loopback)
#   agentcontrol-gw    — Vexa policy enforcement gateway (port 8080 loopback)
#
# Local Quick Start:
#   1. cp .env.team.example .env
#   2. Edit .env with your secrets
#   3. docker compose -f docker-compose.team.yml up -d
#   # Access Web Console: http://127.0.0.1:3000
#   # Gateway Endpoint:   http://127.0.0.1:8080

name: vexa-team-hub-local-demo

services:
  # ── PostgreSQL Database ───────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: vexa-team-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vexa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-vexa_control_plane}
    volumes:
      - vexa-postgres-data:/var/lib/postgresql/data
      - ./control-plane/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vexa} -d ${POSTGRES_DB:-vexa_control_plane}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - vexa-team-net

  # ── Control Plane API ─────────────────────────────────────────────────────
  control-plane-api:
    image: ghcr.io/noviqtechnologies/agentcontrol-dashboard-api:latest
    build:
      context: ./control-plane/api
      dockerfile: Dockerfile
    container_name: vexa-team-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8081
      DATABASE_URL: postgres://${POSTGRES_USER:-vexa}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-vexa_control_plane}?sslmode=disable
      DEV_MODE: "${DEV_MODE:-true}"
      ALLOW_DEV_MODE: "${ALLOW_DEV_MODE:-true}"
      GATEWAY_SECRET: ${GATEWAY_SECRET:-local-dev-gateway-secret-1234}
      POLICY_READ_SECRET: ${POLICY_READ_SECRET:-local-dev-policy-read-secret}
      PROVIDER_KEY_ENCRYPTION_SECRET: "${PROVIDER_KEY_ENCRYPTION_SECRET:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}"
      AGENTCONTROL_SESSION_SECRET: ${AGENTCONTROL_SESSION_SECRET:-local-dev-session-secret-32-chars-long-123456}
      SAAS_OPERATOR_EMAIL: ${SAAS_OPERATOR_EMAIL:-admin@vexa.local}
      SAAS_OPERATOR_PASSWORD: ${SAAS_OPERATOR_PASSWORD:-admin12345678}
      INGRESS_AUTH_SECRET: "${INGRESS_AUTH_SECRET:-}"
      LEGACY_SINGLE_TENANT_MODE: "${LEGACY_SINGLE_TENANT_MODE:-true}"
      LEGACY_TENANT_ID: "${LEGACY_TENANT_ID:-00000000-0000-0000-0000-000000000001}"
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - vexa-team-net

  # ── Control Plane Web UI Console ──────────────────────────────────────────
  control-plane-ui:
    image: ghcr.io/noviqtechnologies/agentcontrol-dashboard-frontend:latest
    build:
      context: ./control-plane/ui
      dockerfile: Dockerfile
    container_name: vexa-team-ui
    restart: unless-stopped
    depends_on:
      - control-plane-api
    environment:
      AGENTCONTROL_API_URL: http://control-plane-api:8081
      AGENTCONTROL_API_UPSTREAM: control-plane-api:8081
    ports:
      - "127.0.0.1:3000:80"
    networks:
      - vexa-team-net

  # ── Vexa Agent Control Gateway ────────────────────────────────────────────
  agentcontrol-gw:
    image: ghcr.io/noviqtechnologies/agentcontrol:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vexa-team-gateway
    hostname: vexa-demo-gateway
    restart: unless-stopped
    depends_on:
      - control-plane-api
    environment:
      AGENTCONTROL_LISTEN: 0.0.0.0:8080
      AGENTCONTROL_CENTRALIZED: "true"
      AGENTCONTROL_ADMIN_TOKEN: ${GATEWAY_SECRET:-local-dev-gateway-secret-1234}
      AGENTCONTROL_LOG_PATH: /var/log/agentcontrol/audit.log
      AGENTCONTROL_DRY_RUN: "false"
      AGENTCONTROL_HUB_URL: http://control-plane-api:8081
      DASHBOARD_API_URL: http://control-plane-api:8081
      GATEWAY_SECRET: ${GATEWAY_SECRET:-local-dev-gateway-secret-1234}
      POLICY_READ_SECRET: ${POLICY_READ_SECRET:-local-dev-policy-read-secret}
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - vexa-team-net

volumes:
  vexa-postgres-data:
    driver: local

networks:
  vexa-team-net:
    driver: bridge

