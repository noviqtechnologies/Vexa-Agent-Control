name: Agent Control Assessment

on:
  pull_request:
    branches:
      - main
    paths:
      - '**/*.yaml'
      - '**/*.yml'
  workflow_dispatch:

jobs:
  assess-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Agent Control
        run: |
          curl -sL https://raw.githubusercontent.com/noviqtechnologies/Vexa-Agent-Control/main/install/install.sh | bash
          echo "$HOME/.agentcontrol/bin" >> $GITHUB_PATH

      - name: Validate Policy Format
        run: |
          agentcontrol lint agentcontrol-policy.yaml

      - name: Run Shadow Analysis
        run: |
          agentcontrol test --gateway "http://test-environment" --policy agentcontrol-policy.yaml test_fixtures/mcp_traffic.json
