name: Secret & Credential Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  secret-scan:
    name: Detect Accidental & Insecure Credentials
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan Repository for Insecure Production Credentials
        shell: bash
        run: |
          echo "Scanning for hardcoded known insecure credentials in active deployment configurations..."
          
          # Check production-looking compose files and documentation for weak tokens
          FAILURES=0
          
          # Check if examples/production contains known placeholders
          if grep -E "(admin123456|devpassword|local-dev-)" examples/production/docker-compose.yml > /dev/null 2>&1; then
            echo "[SECURITY ERROR] Found weak credentials in examples/production/docker-compose.yml"
            FAILURES=$((FAILURES + 1))
          fi
          
          # Check docs install paths for raw static passwords
          if grep -rn 'AGENTCONTROL_ADMIN_TOKEN="admin123456"' docs/install/ > /dev/null 2>&1; then
            echo "[SECURITY ERROR] Found hardcoded AGENTCONTROL_ADMIN_TOKEN=\"admin123456\" in docs/install/"
            FAILURES=$((FAILURES + 1))
          fi
          
          if [ $FAILURES -gt 0 ]; then
            echo "Secret scan failed with $FAILURES security violations."
            exit 1
          fi
          
          echo "[OK] Secret hygiene scan passed."
