name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ── 1. Clean Reproducibility Job (No Cache) ──────────────────────────────────
  clean-reproducibility:
    name: Clean Container Validation (No Cache)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust Toolchain (Pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: clippy, rustfmt

      - name: Print Exact Toolchain Versions
        run: |
          echo "=== Pinned Toolchain Diagnostics ==="
          rustc --version
          cargo --version

      - name: Format Check
        run: cargo fmt --check

      - name: Clippy Linter (Deny Warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build Binary from Scratch
        run: cargo build --release --locked

      - name: Full Test Suite
        run: cargo test --release --all-targets --locked

  # ── 2. Multi-OS Matrix with Caching Optimization ─────────────────────────────
  test-matrix:
    name: Test Matrix (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: clippy, rustfmt

      - name: Print Toolchain Versions
        shell: bash
        run: |
          echo "=== Toolchain Versions ==="
          rustc --version
          cargo --version

      - name: Cache dependencies (Optimization only)
        uses: Swatinem/rust-cache@v2
        continue-on-error: true

      - name: Check code formatting
        run: cargo fmt --check

      - name: Run clippy linter
        run: cargo clippy --all-targets -- -D warnings

      - name: Run all tests
        run: cargo test --all-targets

  # ── 3. Multi-Component Checks (Go API & Node/React UI) ──────────────────────
  components-validation:
    name: Go API & Web UI Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.7'
          check-latest: false

      - name: Print Go Version
        run: go version

      - name: Validate Control Plane Go API
        working-directory: control-plane/api
        run: |
          echo "Checking Go formatting..."
          test -z "$(gofmt -l .)"
          echo "Running Go vet..."
          go vet ./...

      - name: Validate Operator Go API
        working-directory: operator
        run: |
          echo "Running Operator Go vet..."
          go vet ./...

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'
          cache-dependency-path: 'control-plane/ui/package-lock.json'

      - name: Print Node/npm Versions
        run: |
          node -v
          npm -v

      - name: Build Web UI Dashboard
        working-directory: control-plane/ui
        run: |
          npm ci
          npm run build

  # ── 4. Phase 1 Exit Gate — Local Explainable Protection ──────────────────────
  # Plan Review Feedback v4 §Phase-1 (11 mandatory criteria)
  # Validates: approval secret isolation, scope enforcement, HITL harness,
  # audit migration backward compatibility, local API CSRF/DNS rebinding guards.
  phase1-exit-gate:
    name: Phase 1 Exit Gate (${{ matrix.target }})
    needs: [test-matrix]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        continue-on-error: true

      - name: Gate 8 – Approval Token Leakage Prevention
        run: cargo test --test integration approval_leakage

      - name: Gate 5 – Local API Security (CSRF, DNS rebinding, scopes)
        run: cargo test --test integration local_api_security

      - name: Gate 4 – HITL 6-State Machine (inline integration tests)
        run: cargo test --test integration hitl_state_machine

      - name: Phase 0b – HITL CAS & Crash Recovery Harness
        run: cargo test --test hitl_harness

      - name: Phase 0b – Audit Migration Backward Compatibility
        run: cargo test --test integration audit_migration

      - name: Phase 1 – Cross-OS IPC & Permissions Harness
        run: cargo test --test integration cross_os_harness

      - name: Phase 2 – Trace Canonical Envelope Validation
        run: cargo test --test integration trace_canonical_envelope

      - name: Gate 6 – Native JSON/JSONL Export (lib unit tests)
        run: cargo test --lib audit

      - name: Gate 10 – Bypass Resistance Corpus (lib security tests)
        run: cargo test --lib detector

  # ── 5. Phase 2 Cross-Platform Security Gate ──────────────────────────────────
  # ADR-006 / Plan Review Feedback v4 §Phase-2
  # Runs the deterministic replay engine unit tests and benchmark suite across
  # all three OS families as mandatory exit gates before Phase 3 features unlock.
  phase2-security-gate:
    name: Phase 2 Security Gate (${{ matrix.target }})
    needs: [phase1-exit-gate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        continue-on-error: true

      - name: Phase 0b – HITL CAS & Crash Recovery Harness
        run: cargo test --test hitl_harness

      - name: Run Unit Tests (lib)
        run: cargo test --lib

      - name: Run Integration Tests
        run: cargo test --test integration

      - name: Run Eval Module Tests (Phase 2 Replay Engine)
        run: cargo test --lib eval

      - name: Run Audit Migration Matrix
        run: cargo test --test integration audit_migration

      - name: Run HITL State Machine Tests
        run: cargo test --test integration hitl_state_machine

      - name: Run Benchmark Suite (Release mode — generates release receipt)
        run: cargo bench --bench benchmark_suite -- --output-format bencher

      - name: Verify Benchmark Release Receipt Exists and Passed
        shell: bash
        run: |
          if [ ! -f "target/benchmark_release_receipt.json" ]; then
            echo "❌ CRITICAL: Benchmark release receipt not found! Benchmark suite failed to generate receipt."
            exit 1
          fi
          echo "✔ Benchmark release receipt generated successfully:"
          cat target/benchmark_release_receipt.json
          STATUS=$(python3 -c "import sys,json; d=json.load(open('target/benchmark_release_receipt.json')); print(d['decision']['status'])")
          if [ "$STATUS" != "PASS" ]; then
            echo "❌ CRITICAL: Benchmark gate decision is '$STATUS', required 'PASS'!"
            exit 1
          fi
          echo "✔ Benchmark release gate PASSED with verified measurements."

  # ── 5. Phase 3 Team Collaboration & Central Control Gate ─────────────────────
  # ADR-008 / Plan Review Feedback v4 §Phase-3
  # Validates all 7 exit gates: multi-user workspace, RBAC payload access,
  # signed policy distribution, instant revocation (<30s), cross-developer
  # trace correlation (W3C traceparent), OTLP export compliance, and
  # disaster recovery backup/restore with cryptographic integrity verification.
  phase3-collaboration-gate:
    name: Phase 3 Collaboration Gate (${{ matrix.target }})
    needs: [phase2-security-gate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        continue-on-error: true

      - name: Gate 1 – Multi-User Workspace (lib unit tests)
        run: cargo test --lib policy::revocation

      - name: Gate 2 – RBAC & Telemetry Unit Tests
        run: cargo test --lib telemetry

      - name: Gate 3 – Signed Policy Distribution Tests
        run: cargo test --lib policy::signed

      - name: Gate 4 & 5 – Revocation + Trace Correlation
        run: cargo test --lib

      - name: Gates 1-7 – Phase 3 Integration Test Suite
        run: cargo test --test integration phase3

      - name: Verify binary compiles cleanly (no warnings)
        run: cargo check --bin agentcontrol

