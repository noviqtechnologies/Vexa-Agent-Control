name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

jobs:
  release-gate:
    name: Mandatory Release Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: clippy, rustfmt

      - name: Format Check
        run: cargo fmt --check

      - name: Clippy Linter (Deny Warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test Suite Validation
        run: cargo test --all-targets

  build:
    name: Build and Package
    needs: [release-gate]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            arch_name: linux-x86_64
            use_cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            arch_name: linux-aarch64
            use_cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            arch_name: macos-x86_64
            use_cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            arch_name: macos-aarch64
            use_cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch_name: windows-x86_64
            use_cross: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        id: get_version
        shell: bash
        run: |
          VERSION=$(grep -m 1 "^version = " Cargo.toml | cut -d '"' -f 2)
          echo "VERSION=v$VERSION" >> $GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}

      - name: Install Cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build binary (Cargo)
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build binary (Cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Prepare Release Directory
        shell: bash
        run: |
          mkdir -p release/bin
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/agentcontrol.exe release/bin/
          else
            cp target/${{ matrix.target }}/release/agentcontrol release/bin/
          fi
          cp quickstart_agent.py release/bin/

      - name: Create Zip (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd release
          zip -r ../agentcontrol-${{ env.VERSION }}-${{ matrix.arch_name }}.zip .

      - name: Create Zip (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path release\* -DestinationPath agentcontrol-${{ env.VERSION }}-${{ matrix.arch_name }}.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentcontrol-${{ matrix.arch_name }}
          path: agentcontrol-${{ env.VERSION }}-${{ matrix.arch_name }}.zip

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        id: get_version
        shell: bash
        run: |
          VERSION=$(grep -m 1 "^version = " Cargo.toml | cut -d '"' -f 2)
          echo "VERSION=v$VERSION" >> $GITHUB_ENV

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: agentcontrol-*

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.1

      - name: Generate Syft SBOM for Artifacts
        uses: anchore/sbom-action@v0.18.0
        with:
          path: ./artifacts
          format: spdx-json
          output-file: artifacts/agentcontrol-sbom.spdx.json
          upload-release-assets: false

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Package Helm Chart
        shell: bash
        run: |
          CHART_VER="${VERSION#v}"
          helm package ./chart --version "$CHART_VER" --app-version "$CHART_VER" -d artifacts/

      - name: Generate Checksums Manifest (SHA-256 & SHA-512)
        shell: bash
        run: |
          cd artifacts
          echo "# SHA-256 Digests" > checksums.txt
          find . -type f \( -name "*.zip" -o -name "*.tgz" \) -exec sha256sum {} + | sed 's|./[^/]*/||' >> checksums.txt
          echo "" >> checksums.txt
          echo "# SHA-512 Digests" >> checksums.txt
          find . -type f \( -name "*.zip" -o -name "*.tgz" \) -exec sha512sum {} + | sed 's|./[^/]*/||' >> checksums.txt
          echo "Generated checksums.txt:"
          cat checksums.txt

      - name: Sign Checksums with Cosign (Keyless - Fail-Closed)
        shell: bash
        run: |
          SIGNED=0
          for i in 1 2 3; do
            if cosign sign-blob --yes \
              --bundle artifacts/checksums.txt.bundle \
              artifacts/checksums.txt; then
              SIGNED=1
              break
            fi
            echo "Retrying cosign sign-blob in 5s (attempt $i/3)..."
            sleep 5
          done
          if [ "$SIGNED" -ne 1 ]; then
            echo "::error::Cryptographic signing with Cosign failed. Failing release gate closed."
            exit 1
          fi

      - name: Generate SLSA Build Provenance Attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            artifacts/**/*.zip
            artifacts/*.tgz

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Vexa Agent Control ${{ env.VERSION }}
          files: |
            artifacts/**/*.zip
            artifacts/*.tgz
            artifacts/checksums.txt
            artifacts/checksums.txt.bundle
            artifacts/agentcontrol-sbom.spdx.json
          generate_release_notes: true
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-docker:
    name: Publish Docker Image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        id: get_version
        shell: bash
        run: |
          VERSION=$(grep -m 1 "^version = " Cargo.toml | cut -d '"' -f 2)
          echo "VERSION=v$VERSION" >> $GITHUB_ENV

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Gateway image
        id: build_gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/noviqtechnologies/agentcontrol:latest
            ghcr.io/noviqtechnologies/agentcontrol:${{ env.VERSION }}

      - name: Sign Gateway Docker Image (Keyless)
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            cosign sign --yes "ghcr.io/noviqtechnologies/agentcontrol@${{ steps.build_gateway.outputs.digest }}" && break || sleep 5
          done

      - name: Build and push Dashboard API image
        id: build_api
        uses: docker/build-push-action@v6
        with:
          context: ./control-plane/api
          file: ./control-plane/api/Dockerfile
          push: true
          tags: |
            ghcr.io/noviqtechnologies/agentcontrol-dashboard-api:latest
            ghcr.io/noviqtechnologies/agentcontrol-dashboard-api:${{ env.VERSION }}

      - name: Sign Dashboard API Docker Image (Keyless)
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            cosign sign --yes "ghcr.io/noviqtechnologies/agentcontrol-dashboard-api@${{ steps.build_api.outputs.digest }}" && break || sleep 5
          done

      - name: Build and push Dashboard Frontend image
        id: build_frontend
        uses: docker/build-push-action@v6
        with:
          context: ./control-plane/ui
          file: ./control-plane/ui/Dockerfile
          push: true
          tags: |
            ghcr.io/noviqtechnologies/agentcontrol-dashboard-frontend:latest
            ghcr.io/noviqtechnologies/agentcontrol-dashboard-frontend:${{ env.VERSION }}

      - name: Sign Dashboard Frontend Docker Image (Keyless)
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            cosign sign --yes "ghcr.io/noviqtechnologies/agentcontrol-dashboard-frontend@${{ steps.build_frontend.outputs.digest }}" && break || sleep 5
          done

      - name: Build and push Database image
        id: build_db
        uses: docker/build-push-action@v6
        with:
          context: ./control-plane/db
          file: ./control-plane/db/Dockerfile
          push: true
          tags: |
            ghcr.io/noviqtechnologies/agentcontrol-db:latest
            ghcr.io/noviqtechnologies/agentcontrol-db:${{ env.VERSION }}

      - name: Sign Database Docker Image (Keyless)
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            cosign sign --yes "ghcr.io/noviqtechnologies/agentcontrol-db@${{ steps.build_db.outputs.digest }}" && break || sleep 5
          done

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Package and Push Helm Chart to GHCR (OCI)
        shell: bash
        run: |
          CHART_VER="${VERSION#v}"
          helm package ./chart --version "$CHART_VER" --app-version "$CHART_VER"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push "agentcontrol-${CHART_VER}.tgz" oci://ghcr.io/noviqtechnologies/charts

