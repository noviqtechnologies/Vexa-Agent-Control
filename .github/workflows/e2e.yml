name: End-to-End Matrix Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  e2e-matrix:
    name: E2E Acceptance (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bin_name: agentcontrol
          - os: macos-latest
            bin_name: agentcontrol
          - os: windows-latest
            bin_name: agentcontrol.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Binary
        run: cargo build --release

      - name: Run Unit and Integration Tests
        run: cargo test --release

      - name: Run Process-Level Stdio Integration Test
        run: cargo test -p agentcontrol --test integration stdio_process_integration -- --nocapture

      - name: Test Dry-Run Protect
        run: ./target/release/${{ matrix.bin_name }} protect --dry-run

      - name: Test Status Command
        run: ./target/release/${{ matrix.bin_name }} status

      - name: Run Live Verification Smoke Test (Background Gateway)
        run: |
          ./target/release/${{ matrix.bin_name }} protect --no-browser &
          GATEWAY_PID=$!
          sleep 4
          ./target/release/${{ matrix.bin_name }} verify --gateway "http://127.0.0.1:8080"
          kill -9 $GATEWAY_PID || true

      - name: Test Dry-Run Unprotect
        run: ./target/release/${{ matrix.bin_name }} unprotect --dry-run
