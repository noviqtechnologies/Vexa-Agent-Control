name: Vexa SCA Security Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      create_fix_pr:
        description: "Generate and open automated Security Fix PR"
        type: boolean
        default: false
        required: false

permissions:
  contents: write         # Needed to push fix branch
  pull-requests: write    # Needed to open GitHub PR
  security-events: write

jobs:
  security-scan:
    name: Vexa SCA Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Vexa SCA CLI
        run: |
          curl -sSL "https://github.com/noviqtechnologies/vexa-sca/releases/latest/download/vexa-sca-linux-x86_64.tar.gz" | tar -xz
          sudo mv vexa-sca /usr/local/bin/
          vexa-sca --version

      # Standard Quality Gate Scan on Push / Pull Request
      - name: Execute Vexa SCA Quality Gate
        run: |
          vexa-sca scan . \
            --fail-on critical \
            --sarif-file results.sarif \
            --html-file scan-dashboard.html \
            --sbom cyclonedx \
            --sbom-file sbom.json

      # Automated Remediation PR Step (Executes when toggled on)
      - name: Create Automated Fix PR
        if: ${{ github.event.inputs.create_fix_pr == 'true' }}
        run: |
          git config --global user.name "vexa-sca-bot[bot]"
          git config --global user.email "vexa-sca-bot@users.noreply.github.com"
          vexa-sca fix . \
            --create-pr \
            --repo "${{ github.repository }}" \
            --token "${{ secrets.GITHUB_TOKEN }}" \
            --base "main"

      - name: Upload SARIF to GitHub Security Alerts
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif

      - name: Archive HTML Dashboard & SBOM
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vexa-reports
          path: |
            scan-dashboard.html
            sbom.json
