[workspace]
members = [".", "control-plane/proto"]

[package]
name = "agentwall"
version = "1.0.26"
edition = "2021"
description = "VEXA AgentWall — centralized enterprise security gateway enforcing deterministic policies for AI agent tool calls over MCP"
license = "Apache-2.0"

[[bin]]
name = "agentwall"
path = "src/main.rs"

[lib]
name = "agentwall"
path = "src/lib.rs"

[dependencies]
# FR-23: Dashboard wire-boundary types
control-plane-proto = { path = "control-plane/proto" }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Async runtime (Pruned unused features like tracing/fs)
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "io-util",
    "io-std",
    "process",
    "net",
    "sync",
    "time",
    "signal"
] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-stream = "0.1"
socket2 = { version = "0.5", features = ["all"] }

# HTTP Engine (Hyper 1.0 ecosystem)
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "client", "tokio", "http1", "http2"] }
http-body-util = "0.1"
bytes = "1"

# Crypto
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
aes-gcm = "0.10"

# Regex
regex = "1"

# JSON Schema (FR-201)
jsonschema = "0.17"

# Identity (FR-202)
jsonwebtoken = "9"
dashmap = "5"

# Signing (FR-204)
ed25519-dalek = { version = "2", features = ["pkcs8", "rand_core"] }

# UUID
uuid = { version = "1", features = ["v4"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Random
rand = "0.8"

# Reqwest HTTP Client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking", "stream"] }
eventsource-stream = "0.2"

rusqlite = { version = "0.31", features = ["bundled"] }
shlex = "1.3"

# OS-specific dirs (FR-304: agentwall wrap)
dirs = "5"

# OS Keychain integration for PKI identity
keyring = "2"

# Filesystem events (FR-watch: agentwall watch daemon)
notify = "6"

# Ctrl-C / SIGTERM handler (FR-watch: daemon graceful shutdown)
ctrlc = "3"

# Utilities & WebSockets
colored = "2"
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-native-roots"] }
base64 = "0.22.1"
hyper-tungstenite = "0.20.0"
futures-util = "0.3.32"
bip39 = "2.2.2"
unicode-normalization = "0.1.25"
urlencoding = "2.1.3"
tokio-rustls = "0.26"
rustls-pemfile = "2"
toml = "1.1.3"

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"
tokio-test = "0.4"
assert_cmd = "2"
predicates = "3"

[[bench]]
name = "policy_eval"
harness = false

[[bench]]
name = "proxy_overhead"
harness = false

[[bench]]
name = "safe_mode"
harness = false

# --- Compilation Speed Optimizations ---

[profile.dev]
# Minimal debug info for workspace code - speeds up linking on Windows significantly
debug = "line-tables-only"
# Fast split-debuginfo generation on Windows MSVC
split-debuginfo = "unpacked"

[profile.dev.package."*"]
# Optimize dependencies once so your gateway runs fast during testing,
# while disabling their debug symbols to keep linking lightweight.
opt-level = 2
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true