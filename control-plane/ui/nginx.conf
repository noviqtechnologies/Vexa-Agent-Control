server {
    listen 80;
    listen 8081;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all routes serve index.html, React Router handles them.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to dashboard-api.
    # The upstream address is environment-dependent, so it is templated rather
    # than hardcoded: on ECS Fargate every container shares one network
    # namespace and the API is on 127.0.0.1:8400, but under Docker Compose each
    # service gets its own namespace and must be addressed by service name
    # (dashboard-api:8400). See AGENTWALL_API_UPSTREAM in the Dockerfile.
    location /api/ {
        proxy_pass ${AGENTWALL_API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE support for /api/v1/alerts/stream.
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
    }

    # Security headers.
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://* https://*" always;

    # Cache static assets aggressively (Vite hashes filenames).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

