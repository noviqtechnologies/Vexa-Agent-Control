# ══════════════════════════════════════════════════════════════════════════════
# VEXA AGENT CONTROL — LOCAL DEVELOPMENT & TEST MOCK STACK
# ══════════════════════════════════════════════════════════════════════════════

name: vexa-agentcontrol-dev

services:
  # ── Mock OIDC Provider ──────────────────────────────────────────────────────
  mock-oidc:
    container_name: vexa-agentcontrol-mock-oidc
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ../../test-tools:/app
    command: >
      sh -c "pip install cryptography pyjwt --quiet && python3 mock_oidc.py --port 8082 --audience agentcontrol"
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - agentcontrol-net

  # ── Mock Splunk HEC ─────────────────────────────────────────────────────────
  mock-splunk:
    container_name: vexa-agentcontrol-mock-splunk
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ../../test-tools:/app
    command: python3 mock_splunk.py --port 8088
    ports:
      - "8088:8088"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8088/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - agentcontrol-net

  # ── Mock MCP Tool Server ────────────────────────────────────────────────────
  mock-mcp:
    container_name: vexa-agentcontrol-mock-mcp
    build:
      context: ../../test-tools/mock-mcp-server
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - agentcontrol-net

  # ── AgentControl Gateway (Dev Mode) ─────────────────────────────────────────
  agentcontrol:
    container_name: vexa-agentcontrol-gateway-dev
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "${AGENTCONTROL_GATEWAY_PORT:-18080}:18080"
    volumes:
      - ../../policy.example.yaml:/app/policy.yaml:ro
      - agentcontrol-logs:/var/log/agentcontrol
    environment:
      DEV_MODE: "true"
      AGENTCONTROL_LISTEN: "0.0.0.0:18080"
      AGENTCONTROL_MCP_URL: "http://mock-mcp:3000"
      AGENTCONTROL_LOG_PATH: "/var/log/agentcontrol/audit.log"
      AGENTCONTROL_DRY_RUN: "false"
      POLICY_READ_SECRET: "${POLICY_READ_SECRET:-local-dev-policy-read-secret}"
      AGENTCONTROL_OIDC_ISSUER: "http://mock-oidc:8082"
      AGENTCONTROL_SIEM_BACKEND: "splunk"
      AGENTCONTROL_SIEM_ENDPOINT: "http://mock-splunk:8088/services/collector/event"
      AGENTCONTROL_SIEM_TOKEN: "${SIEM_TOKEN:-mock-splunk-token-for-local-dev}"
      AGENTCONTROL_SIEM_TIMEOUT: "2"
      ALLOW_WILDCARD_IDENTITY: "true"
    command:
      - "start"
      - "--policy"
      - "/app/policy.yaml"
    depends_on:
      mock-oidc:
        condition: service_healthy
      mock-splunk:
        condition: service_healthy
      mock-mcp:
        condition: service_started
    healthcheck:
      test: ["CMD", "agentcontrol", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - agentcontrol-net

volumes:
  agentcontrol-logs:

networks:
  agentcontrol-net:
    driver: bridge
