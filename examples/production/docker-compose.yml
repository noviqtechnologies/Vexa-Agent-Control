# ══════════════════════════════════════════════════════════════════════════════
# VEXA AGENT CONTROL — PRODUCTION HARDENED DEPLOYMENT PROFILE
# ══════════════════════════════════════════════════════════════════════════════
# Requirements:
#   - Pinned container image digests
#   - Non-root container privileges
#   - Mandatory strong secrets via .env (no insecure fallback defaults)
#   - TLS termination on 443 via Caddy
# ══════════════════════════════════════════════════════════════════════════════

name: vexa-production-hub

services:
  # ── Caddy Reverse Proxy & TLS Termination ─────────────────────────────────
  caddy:
    image: caddy:2.8.4-alpine
    container_name: vexa-prod-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      HUB_DOMAIN: ${HUB_DOMAIN:?HUB_DOMAIN is required in production .env}
      INGRESS_AUTH_SECRET: ${INGRESS_AUTH_SECRET:?INGRESS_AUTH_SECRET is required in production .env}
    volumes:
      - ../../deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - control-plane-ui
      - control-plane-api
    networks:
      - vexa-prod-net

  # ── PostgreSQL Relational Database ────────────────────────────────────────
  postgres:
    image: postgres:16.4-alpine
    container_name: vexa-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required in production .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in production .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required in production .env}
    volumes:
      - vexa-prod-postgres-data:/var/lib/postgresql/data
      - ../../control-plane/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - vexa-prod-net

  # ── Control Plane API ─────────────────────────────────────────────────────
  control-plane-api:
    image: ghcr.io/noviqtechnologies/agentcontrol-dashboard-api:v1.0.95
    container_name: vexa-prod-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8081
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      DEV_MODE: "false"
      GATEWAY_SECRET: ${GATEWAY_SECRET:?GATEWAY_SECRET is required in production .env}
      POLICY_READ_SECRET: ${POLICY_READ_SECRET:?POLICY_READ_SECRET is required in production .env}
      PROVIDER_KEY_ENCRYPTION_SECRET: ${PROVIDER_KEY_ENCRYPTION_SECRET:?PROVIDER_KEY_ENCRYPTION_SECRET is required in production .env}
      AGENTCONTROL_SESSION_SECRET: ${AGENTCONTROL_SESSION_SECRET:?AGENTCONTROL_SESSION_SECRET is required in production .env}
      SAAS_OPERATOR_EMAIL: ${SAAS_OPERATOR_EMAIL:?SAAS_OPERATOR_EMAIL is required in production .env}
      SAAS_OPERATOR_PASSWORD: ${SAAS_OPERATOR_PASSWORD:?SAAS_OPERATOR_PASSWORD is required in production .env}
      INGRESS_AUTH_SECRET: ${INGRESS_AUTH_SECRET:?INGRESS_AUTH_SECRET is required in production .env}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - vexa-prod-net

  # ── Control Plane UI Console ──────────────────────────────────────────────
  control-plane-ui:
    image: ghcr.io/noviqtechnologies/agentcontrol-dashboard-frontend:v1.0.95
    container_name: vexa-prod-ui
    restart: unless-stopped
    depends_on:
      - control-plane-api
    environment:
      AGENTCONTROL_API_URL: http://control-plane-api:8081
      AGENTCONTROL_API_UPSTREAM: control-plane-api:8081
    networks:
      - vexa-prod-net

volumes:
  vexa-prod-postgres-data:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local

networks:
  vexa-prod-net:
    driver: bridge
