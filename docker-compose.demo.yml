version: '3.8'

services:
  agentwall:
    build:
      context: .
      dockerfile: Dockerfile.standalone
    image: agentwall-standalone:latest
    container_name: agentwall-demo
    ports:
      # Dashboard UI (Container port 80 mapped to host 8081)
      - "8081:80"
      # Agent Gateway (Container port 8080 mapped to host 8443)
      - "8443:8080"
