[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vexaagentwall"
version = "1.0.27"
description = "Python client SDK for Vexa Agent Control AI security gateway & firewall"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "VexaSec / NoviqTech", email = "security@vexasec.io" },
]
keywords = ["ai", "agents", "mcp", "security", "guardrails", "firewall", "governance"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.25.0",
    "typing-extensions>=4.5.0; python_version < '3.10'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "respx>=0.20.0",
]

[project.urls]
Homepage = "https://vexasec.io"
Documentation = "https://github.com/noviqtechnologies/agentwall/tree/main/docs"
Repository = "https://github.com/noviqtechnologies/agentwall"
Issues = "https://github.com/noviqtechnologies/agentwall/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agentwall"]
