# ─── Vexa Agent Control — Small Team Hub Example Deployment Template ─────────
#
# Production Usage:
#   1. cp .env.team.example .env
#   2. Populate .env with cryptographically random secrets
#   3. docker compose -f compose.team.example.yml up -d

name: vexa-team-hub

services:
  postgres:
    image: postgres:16-alpine
    container_name: vexa-team-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vexa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
      POSTGRES_DB: ${POSTGRES_DB:-vexa_control_plane}
    volumes:
      - vexa-postgres-data:/var/lib/postgresql/data
      - ./control-plane/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vexa} -d ${POSTGRES_DB:-vexa_control_plane}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - vexa-team-net

  control-plane-api:
    image: ghcr.io/noviqtechnologies/agentcontrol-dashboard-api:latest
    build:
      context: ./control-plane/api
      dockerfile: Dockerfile
    container_name: vexa-team-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8081
      DATABASE_URL: postgres://${POSTGRES_USER:-vexa}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vexa_control_plane}?sslmode=disable
      DEV_MODE: "${DEV_MODE:-false}"
      GATEWAY_SECRET: ${GATEWAY_SECRET:?GATEWAY_SECRET is required in .env}
      POLICY_READ_SECRET: ${POLICY_READ_SECRET:?POLICY_READ_SECRET is required in .env}
      PROVIDER_KEY_ENCRYPTION_SECRET: "${PROVIDER_KEY_ENCRYPTION_SECRET:?PROVIDER_KEY_ENCRYPTION_SECRET is required in .env}"
      AGENTCONTROL_SESSION_SECRET: ${AGENTCONTROL_SESSION_SECRET:?AGENTCONTROL_SESSION_SECRET is required in .env}
      SAAS_OPERATOR_EMAIL: ${SAAS_OPERATOR_EMAIL:-admin@vexa.local}
      SAAS_OPERATOR_PASSWORD: ${SAAS_OPERATOR_PASSWORD:?SAAS_OPERATOR_PASSWORD is required in .env}
      INGRESS_AUTH_SECRET: "${INGRESS_AUTH_SECRET:-}"
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - vexa-team-net

  control-plane-ui:
    image: ghcr.io/noviqtechnologies/agentcontrol-dashboard-frontend:latest
    build:
      context: ./control-plane/ui
      dockerfile: Dockerfile
    container_name: vexa-team-ui
    restart: unless-stopped
    depends_on:
      - control-plane-api
    environment:
      AGENTCONTROL_API_URL: http://control-plane-api:8081
      AGENTCONTROL_API_UPSTREAM: control-plane-api:8081
    ports:
      - "3000:80"
    networks:
      - vexa-team-net

  agentcontrol-gw:
    image: ghcr.io/noviqtechnologies/agentcontrol:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vexa-team-gateway
    hostname: vexa-demo-gateway
    restart: unless-stopped
    depends_on:
      - control-plane-api
    environment:
      AGENTCONTROL_LISTEN: 0.0.0.0:8080
      AGENTCONTROL_CENTRALIZED: "true"
      AGENTCONTROL_ADMIN_TOKEN: ${GATEWAY_SECRET}
      AGENTCONTROL_LOG_PATH: /var/log/agentcontrol/audit.log
      AGENTCONTROL_DRY_RUN: "false"
      AGENTCONTROL_HUB_URL: http://control-plane-api:8081
      DASHBOARD_API_URL: http://control-plane-api:8081
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      POLICY_READ_SECRET: ${POLICY_READ_SECRET}
    ports:
      - "8080:8080"
    networks:
      - vexa-team-net

volumes:
  vexa-postgres-data:
    driver: local

networks:
  vexa-team-net:
    driver: bridge
