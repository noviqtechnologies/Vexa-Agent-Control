# Vexa Agent Control — Canonical Secret Policy & Validation Contract (DEP-002)
# Shared specification for Rust Proxy and Go Control Plane API.

version: 1

forbidden_placeholders:
  - "devpassword"
  - "change-me"
  - "changeme"
  - "secret"
  - "admin123"
  - "password"
  - "default-gateway-secret"
  - "replace-with-secure-random-secret"
  - "your-session-secret"
  - "your-encryption-secret"

required_secrets:
  control_plane:
    - name: "POSTGRES_PASSWORD"
      min_entropy_bytes: 16
    - name: "GATEWAY_SECRET"
      min_entropy_bytes: 32
    - name: "POLICY_READ_SECRET"
      min_entropy_bytes: 32
    - name: "PROVIDER_KEY_ENCRYPTION_SECRET"
      min_entropy_bytes: 32
    - name: "AGENTCONTROL_SESSION_SECRET"
      min_entropy_bytes: 32
    - name: "SAAS_OPERATOR_PASSWORD"
      min_entropy_bytes: 12
    - name: "INGRESS_AUTH_SECRET"
      min_entropy_bytes: 32

  gateway_proxy:
    - name: "GATEWAY_SECRET"
      min_entropy_bytes: 32

dev_mode:
  env_var: "DEV_MODE"
  behavior: "When DEV_MODE=true, log prominent security warning banner; when DEV_MODE=false or unset, halt process startup if placeholder credentials or insufficient entropy are detected."
