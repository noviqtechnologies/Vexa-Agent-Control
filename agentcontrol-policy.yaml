version: "2.1"
default_action: deny

sequence_rules:
  - name: auto_block_sensitive_exfiltration
    window_size: 5
    antecedent_tools:
      - read_file
      - view_file
    antecedent_param_regex: ".*(\\.env|id_rsa|aws/credentials).*"
    consequent_tools:
      - http_post
      - fetch_url
      - bash
    action: block
    message: "Auto-synthesized sequence rule: Outbound call after reading sensitive credential file."

self_healing:
  enabled: true
  decay_window: 30d
  auto_suggest: true
  suggest_threshold: 0.9
  approval_required: true

tools:
  - name: "read_file"
    action: allow
    # risk_tier: TIER_3  confidence: low  (2 observations)
    # confidence_decay: 0.93  last_seen: 2026-08-17T08:37:43+00:00  stale: false
    parameters:
      - name: "path"
        type: string
        required: true
        max_length: 64
        validators:
          - path_traversal
        # enum:
        #  - "./src/main.rs"

  - name: "test_tool"
    action: allow
    # risk_tier: TIER_3  confidence: low  (3 observations)
    # confidence_decay: 0.93  last_seen: 2026-08-17T08:37:43+00:00  stale: false
    parameters:
      - name: "key"
        type: string
        required: true
        max_length: 64
