version: "2.1"
default_action: deny

sequence_rules:
  - name: auto_block_sensitive_exfiltration
    window_size: 5
    antecedent_tools:
      - read_file
      - view_file
    antecedent_param_regex: ".*(\.env|id_rsa|aws/credentials).*"
    consequent_tools:
      - http_post
      - fetch_url
      - bash
    action: block
    message: "Auto-synthesized sequence rule: Outbound call after reading sensitive credential file."

self_healing:
  enabled: true
  decay_window: 30d
  auto_suggest: true
  suggest_threshold: 0.9
  approval_required: true

tools:
  - name: exec_shell
    action: allow
    # risk_tier: TIER_1  confidence: low  (2 observations)
    # confidence_decay: 0.00  last_seen: 2026-06-20T16:43:23+00:00  stale: true
    parameters:
      - name: command
        type: string
        required: true
        max_length: 64
        # enum:
        #  - "echo Hello World"
        #  - "whoami"

  - name: read_file
    action: allow
    # risk_tier: TIER_3  confidence: medium  (40 observations)
    # confidence_decay: 0.00  last_seen: 2026-06-22T17:29:36+00:00  stale: true
    parameters:
      - name: cc
        type: string
        required: false
        max_length: 64
        # enum:
        #  - "Please pay invoice using 4111 1111 1111 1111"
      - name: content
        type: string
        required: false
        max_length: 64
        # enum:
        #  - "My GCP key is AIzaSyD-1234567890123456789012345678901"
      - name: path
        type: string
        required: true
        max_length: 64
        validators:
          - path_traversal
        # enum:
        #  - "sensitive.txt"
        #  - "obfuscated.txt"
