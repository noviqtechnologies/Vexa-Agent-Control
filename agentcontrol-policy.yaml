version: "2.1"
default_action: deny

sequence_rules:
  - name: auto_block_sensitive_exfiltration
    window_size: 5
    antecedent_tools:
      - read_file
      - view_file
    antecedent_param_regex: ".*(\\.env|id_rsa|aws/credentials).*"
    consequent_tools:
      - http_post
      - fetch_url
      - bash
    action: block
    message: "Auto-synthesized sequence rule: Outbound call after reading sensitive credential file."

self_healing:
  enabled: true
  decay_window: 30d
  auto_suggest: true
  suggest_threshold: 0.9
  approval_required: true

