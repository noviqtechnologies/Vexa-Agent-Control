apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentcontrolpolicies.agentcontrol.io
spec:
  group: agentcontrol.io
  names:
    kind: AgentControlPolicy
    listKind: AgentControlPolicyList
    plural: agentcontrolpolicies
    singular: agentcontrolpolicy
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AgentControlPolicy is the Schema for the agentcontrolpolicies API
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            description: AgentControlPolicySpec defines the desired state of AgentControlPolicy
            properties:
              gatewayImage:
                type: string
              policy:
                type: string
              identity:
                properties:
                  provider:
                    type: string
                  vaultAddr:
                    type: string
                type: object
              networkPolicy:
                description: |
                  FR-5 §5.5.8: Egress NetworkPolicy generation. When enforced is
                  true, the operator creates a NetworkPolicy that restricts agent
                  pod egress to the gateway pod on mcpPort only (plus DNS).
                properties:
                  enforced:
                    type: boolean
                  agentPodSelector:
                    additionalProperties:
                      type: string
                    description: |
                      Labels selecting agent pods that will be restricted.
                      Defaults to {agentcontrol.io/agent: "true"} if empty.
                    type: object
                  gatewayPodSelector:
                    additionalProperties:
                      type: string
                    description: |
                      Labels selecting the gateway pod that agents are allowed
                      to reach. Defaults to {agentcontrol.io/gateway: "true"} if empty.
                    type: object
                  mcpPort:
                    description: TCP port the gateway listens on. Defaults to 8080.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                type: object
            type: object
          status:
            description: AgentControlPolicyStatus defines the observed state of AgentControlPolicy
            properties:
              gatewayPodName:
                type: string
              lastReconcileTime:
                type: string
              phase:
                type: string
              networkPolicyName:
                description: Name of the generated NetworkPolicy, if any.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
